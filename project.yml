name: FMSwitch
options:
  bundleIdPrefix: com.drewrobinson
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # The tagged release, taking 0.2.x fixes but not 0.3.0, which may change the API. To work
  # against a local checkout at ../FM1Kit instead, generate from project.local.yml.
  FM1Kit:
    url: https://github.com/ocean/FM1Kit.git
    minorVersion: 0.2.0
# Each developer's signing team, from the git-ignored Signing.local.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    # scripts/check.sh sets FMSWITCH_STRICT=YES to fail on warnings in the app's own targets.
    # Setting the warnings options themselves on the command line would reach FM1Kit too, and
    # Xcode builds a fetched package with warnings suppressed, which clashes.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: $(FMSWITCH_STRICT)
    GCC_TREAT_WARNINGS_AS_ERRORS: $(FMSWITCH_STRICT)
    # Xcode 27 no longer ships x86_64 simulator slices for packages like FM1Kit.
    ONLY_ACTIVE_ARCH: YES
targets:
  FMSwitch:
    type: application
    # One target for iPhone, iPad and a native Mac app.
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - Platform/**
      # Code for one platform only, so neither is compiled (or analysed) for the other.
      - path: App/Platform/iOS
        destinationFilters: [iOS]
      - path: App/Platform/macOS
        destinationFilters: [macOS]
    dependencies:
      - package: FM1Kit
        product: FM1Kit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FM-SWITCH
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIAppFonts:
          - VT323-Regular.ttf
          - Silkscreen-Regular.ttf
          - Silkscreen-Bold.ttf
          - DepartureMono-Regular.otf
        # The Mac's equivalent: every font in the app's Resources folder.
        ATSApplicationFontsPath: .
        LSApplicationCategoryType: public.app-category.music
        # The pixel-art icon on the app's background, drawn by scripts/make-icon.py.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewrobinson.fmswitch
        # XcodeGen doesn't emit it and Xcode 27 has no fallback, which makes
        # both targets try to produce a nameless ".app".
        PRODUCT_NAME: FMSwitch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Xcode 27 leaves an empty SUPPORTED_PLATFORMS (from SDKROOT=auto) unresolvable,
        # so list the platforms explicitly.
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        CODE_SIGN_STYLE: Automatic
        # The Mac app is sandboxed: it reaches the network, opens files the person picks, and
        # talks MIDI, which the sandbox allows.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/FMSwitch-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        ENABLE_PREVIEWS: YES
      # XcodeGen doesn't emit this Debug default, so @testable import of the app fails.
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  FMSwitchTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AppTests
    dependencies:
      - target: FMSwitch
      - package: FM1Kit
        product: FM1Kit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.drewrobinson.fmswitch.tests
        # As with the app target: XcodeGen doesn't emit it and Xcode 27 has no fallback.
        PRODUCT_NAME: FMSwitchTests
        # The app target builds its module with explicit modules; importing it here without
        # them fails with "built for incompatible target" under Xcode 27.
        SWIFT_ENABLE_EXPLICIT_MODULES: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        # A Mac app's executable is inside Contents/MacOS, which XcodeGen's default misses.
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/FMSwitch.app/Contents/MacOS/FMSwitch
        # And the bundle links the host's symbols, which XcodeGen doesn't wire up either.
        BUNDLE_LOADER[sdk=macosx*]: $(TEST_HOST)
schemes:
  FMSwitch:
    build:
      targets:
        FMSwitch: all
    test:
      targets:
        - FMSwitchTests
